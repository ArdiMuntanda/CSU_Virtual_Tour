name: Deploy to GitHub Pages

on:
  push:
    branches:
      - csu-tour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env-config.js with API key
        run: |
          mkdir -p public/scripts
          cat > public/scripts/env-config.js << EOF
          window.__GOOGLE_MAPS_API_KEY__ = "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}";
          window.__APP_CONFIG__ = { VITE_GOOGLE_MAPS_API_KEY: "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" };
          EOF
          cp scripts/config.js public/scripts/config.js

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
