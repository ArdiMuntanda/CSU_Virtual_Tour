  <script src="./scripts/config.js"></script>
    <script defer>
      // Load Google Maps JS dynamically and call initialize after it loads.
      // `config.js` exposes `window.apiKey`.
      (function () {
        var key = (typeof window !== 'undefined') ? window.apiKey : null;
        if (!key) {
          console.error('Google Maps API key is not set (window.apiKey is falsy). Map will not load.');
          return;
        }

        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&v=weekly';
        script.async = true;
        script.defer = true;
        script.onload = function () {
          if (typeof window.initialize === 'function') {
            try { window.initialize(); } catch (e) { console.error('Error calling initialize():', e); }
          } else {
            console.warn('Google Maps API loaded but window.initialize is not defined yet.');
          }
        };
        script.onerror = function (err) {
          console.error('Failed to load Google Maps script:', err);
        };
        document.head.appendChild(script);
      })();
    </script>
